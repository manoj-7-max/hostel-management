services:
  - type: web
    name: hostel-management-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Demo Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hostel-demo-db
    databaseName: hostel
    user: hostel
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
