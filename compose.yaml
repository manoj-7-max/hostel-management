services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hostel}
      POSTGRES_USER: ${DB_USER:-hostel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.hosting}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./hostel_schema.sql:/docker-entrypoint-initdb.d/001-hostel-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO_CREDENTIALS: "false"
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-hostel}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.hosting}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hostel}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.hosting}
      JWT_EXPIRES_IN: 8h
      CLIENT_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.hosting}
      ADMIN_NAME: ${ADMIN_NAME:-Hostel Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.hosting}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a temporary ADMIN_PASSWORD in .env.hosting}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_uploads:/app/private_uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.hosting}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  private_uploads:
  caddy_data:
  caddy_config:
